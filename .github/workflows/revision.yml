# SEG-16: revisión automática de cada PR (tests, seguridad del código y dependencias).
name: Revisión

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: proconseo
          MYSQL_USER: proconseo
          MYSQL_PASSWORD: solo-para-ci
          MYSQL_ROOT_PASSWORD: solo-para-ci-root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # Base de datos desechable que solo existe durante la revisión.
      APP_ENV: ci
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: proconseo
      DB_USER: proconseo
      DB_PASS: solo-para-ci
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, intl, json, mbstring, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: php bin/migrar.php
      # La misma comprobación que hará sistemas en el servidor, sobre esta instalación desde cero.
      - run: php bin/comprobar.php
      - run: vendor/bin/phpunit

  seguridad:
    name: Seguridad del código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, intl, json, mbstring, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Dependencias con fallos de seguridad conocidos
        run: composer audit
      - name: Psalm (errores de código)
        run: vendor/bin/psalm --no-progress --output-format=github
      - name: Psalm (inyección SQL, XSS y otros datos sin limpiar)
        run: vendor/bin/psalm --taint-analysis --ignore-baseline --no-progress --output-format=github

  windows:
    # El servidor de Proconsi es Windows: se prueba ahí también. GitHub no ofrece MySQL como
    # servicio en Windows, así que los tests que necesitan base de datos se saltan aquí (los
    # hace el trabajo de Linux de arriba).
    name: Windows (sin base de datos)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, intl, json, mbstring, openssl, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Tests
        run: vendor/bin/phpunit
      - name: Scripts de PowerShell y web.config sin errores de sintaxis
        shell: pwsh
        run: |
          $mal = 0
          foreach ($f in Get-ChildItem deploy/windows/*.ps1) {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e)
            foreach ($x in $e) { Write-Output "::error file=$($f.Name),line=$($x.Extent.StartLineNumber)::$($x.Message)"; $mal++ }
          }
          [xml](Get-Content public/web.config -Raw) | Out-Null
          if ($mal -gt 0) { exit 1 }
